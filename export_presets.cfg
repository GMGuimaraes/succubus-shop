[preset.4]

name="macOS"
; Diferente do iOS, o export de macOS NAO exige um Mac. Lido na doc oficial (4.7.2,
; "Exporting for macOS"): o que exige Mac + Xcode e um Developer ID e a notarizacao, e este
; build e ad-hoc sem notarizacao de proposito. Consequencia no jogo: Gatekeeper bloqueia na
; primeira abertura ("baixado de uma fonte desconhecida"), entao a pagina da itch precisa
; ensinar o abrir-com-o-botao-direito. Ver docs/itch-io.md.
; O export_path termina em .zip por uma frase literal da mesma doc: "Due to file system
; limitations, .app bundles exported from Windows lack the executable flag and won't run on
; macOS. Projects exported as .zip are not affected by this issue." Um .app solto saindo daqui
; chega no Mac do jogador sem permissao de execucao.
platform="macOS"
runnable=true
dedicated_server=false
custom_features="alpha"
export_filter="all_resources"
include_filter=""
exclude_filter="*.tmp,*.bak,fonts/*.ttf,_tmp_*.gd,tools/*"
export_path=".export/macos/Succubus Shop.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

