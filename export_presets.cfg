; Presets de exportação do Succubus Shop para o itch.io.
;
; Os três gravam dentro de `.export/`, que está no `.gitignore`: o artefato nunca entra
; no commit. `tools/build_itch.sh` é quem chama esses três nomes e empacota os .zip.
;
; A versão gravada no `.exe` (`application/file_version`) é o núcleo de `config/version`
; do `project.godot`, porque o explorador do Windows mostra a dela, não a do jogo —
; discordar as duas é o jogador jurando que roda o build novo. Linux e navegador não têm
; campo de versão no preset: nesses alvos quem anuncia o número é o próprio jogo
; (créditos e `config/version`) e o nome do .zip que sobe para a página.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="alpha"
export_filter="all_resources"
include_filter=""
exclude_filter="*.tmp,*.bak"
export_path=".export/windows/Succubus Shop.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

