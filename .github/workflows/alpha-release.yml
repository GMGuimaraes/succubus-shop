name: Build Windows alpha

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $version = "4.7.2-stable"
          $godotZip = Join-Path $env:RUNNER_TEMP "godot.zip"
          $templatesZip = Join-Path $env:RUNNER_TEMP "templates.zip"
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_win64.exe.zip" -OutFile $godotZip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$version/Godot_v${version}_export_templates.tpz" -OutFile $templatesZip
          $godotDir = Join-Path $env:RUNNER_TEMP "godot"
          $templatesDir = Join-Path $env:RUNNER_TEMP "templates"
          Expand-Archive $godotZip $godotDir
          Expand-Archive $templatesZip $templatesDir
          $godot = Get-ChildItem $godotDir -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1
          if ($null -eq $godot) { throw "Godot console executable was not found in the official archive." }
          if (-not (Test-Path (Join-Path $godotDir "Godot_v4.7.2-stable_win64.exe"))) {
            throw "Godot editor binary required by the console launcher was not found."
          }
          $templateVersion = "4.7.2.stable"
          $installDir = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $templateRoot = Join-Path $templatesDir "templates"
          if (-not (Test-Path $templateRoot)) { throw "Export templates archive has an unexpected layout." }
          Copy-Item (Join-Path $templateRoot "*") $installDir -Recurse -Force
          $windowsTemplate = Join-Path $installDir "windows_release_x86_64.exe"
          if (-not (Test-Path $windowsTemplate)) {
            Get-ChildItem $installDir -Name | Write-Host
            throw "Windows x86_64 release template was not installed."
          }
          "GODOT=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Export Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".export\windows" | Out-Null
          $exportLog = Join-Path $env:RUNNER_TEMP "godot-export.log"
          & $env:GODOT --headless --verbose --log-file $exportLog --path . --export-release "Windows Desktop" ".export\windows\Succubus Shop.exe"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $exportLog) { Get-Content $exportLog -Tail 100 }
            throw "Godot export failed with exit code $LASTEXITCODE."
          }
          $executable = Get-Item ".export\windows\Succubus Shop.exe" -ErrorAction SilentlyContinue
          if ($null -eq $executable -or $executable.Length -lt 1048576) {
            if (Test-Path $exportLog) { Get-Content $exportLog -Tail 100 }
            throw "Godot did not produce a valid Windows executable."
          }
      - name: Package alpha
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Succubus-Shop-Windows-Alpha.zip"
          Compress-Archive -Path ".export\windows\Succubus Shop.exe", "README.md", "LICENSE" -DestinationPath $package
          "PACKAGE=$package" | Out-File $env:GITHUB_ENV -Append
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:PACKAGE" --title "$env:GITHUB_REF_NAME" --prerelease --generate-notes
