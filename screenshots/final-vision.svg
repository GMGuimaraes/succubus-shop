<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Visão conceitual da meta final de Succubus Shop</title>
  <desc id="description">Ilustração conceitual da progressão futura da loja para um império de fantasia, com gestão, expedições, defesa e prestígio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160d27"/>
      <stop offset="1" stop-color="#351242"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fd77cf" stop-opacity=".24"/>
      <stop offset="1" stop-color="#a94cff" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="640" cy="248" r="330" fill="url(#glow)"/>
  <path d="M72 604V242l144-124 144 124v362M920 604V242l144-124 144 124v362" fill="none" stroke="#8e5ca5" stroke-width="5" opacity=".5"/>
